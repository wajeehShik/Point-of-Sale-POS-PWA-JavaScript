
<!DOCTYPE html>
<!--
  يحدد أن المستند يستخدم HTML5،
  وهي النسخة الحديثة من لغة بناء صفحات الويب.
-->

<html lang="ar" dir="rtl">
<!--
  lang="ar": اللغة الأساسية للصفحة هي العربية.
  dir="rtl": اتجاه المحتوى من اليمين إلى اليسار.
  هذا مناسب لعناوين الصفحات والنماذج والقوائم العربية.
-->

<head>
  <!--
    يحتوي head على إعدادات الصفحة وملفات CSS وبيانات التطبيق،
    وليس على معظم المحتوى المرئي للمستخدم.
  -->

  <meta charset="UTF-8">
  <!--
    يحدد ترميز النصوص UTF-8 لدعم العربية والرموز
    دون ظهور أحرف مشوهة عند عرض الصفحة.
  -->

  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">
  <!--
    width=device-width:
    يجعل عرض الصفحة متناسبًا مع عرض شاشة الجهاز.

    initial-scale=1:
    يحدد مستوى التكبير الأولي عند فتح الصفحة.

    viewport-fit=cover:
    يسمح باستخدام مساحة الشاشة الممتدة حول بعض الحواف
    في الأجهزة التي تحتوي على نتوء أو زوايا مستديرة.
    قد يحتاج CSS إلى مراعاة المساحات الآمنة لهذه الأجهزة.
  -->

  <meta name="theme-color" content="#166534">
  <!--
    يعلن اللون الأساسي الذي يمكن للمتصفح استخدامه
    في بعض عناصر واجهة التطبيق، مثل شريط المتصفح على الهاتف.
    اللون هنا أخضر داكن، وهو متوافق مع theme_color في manifest.json.
  -->

  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    وسم قد يساعد أجهزة Apple على عرض الموقع المثبت
    بطريقة أقرب إلى التطبيق المستقل.
    تفاصيل الدعم والسلوك تعتمد على إصدار النظام والمتصفح.
  -->

  <meta name="mobile-web-app-capable" content="yes">
  <!--
    يشير إلى أن الموقع معدّ لتجربة تطبيق ويب على الأجهزة المحمولة.
    سلوك التثبيت الفعلي تحدده أيضًا المنصة وملف Manifest.
  -->

  <link rel="manifest" href="manifest.json">
  <!--
    يربط صفحة HTML بملف manifest.json.
    هذا الملف يعرّف اسم التطبيق وأيقونته وألوانه
    وطريقة عرضه وعنوان البداية عند تشغيله بعد التثبيت.
  -->

  <link rel="icon" href="icons/icon.svg">
  <!--
    يحدد الأيقونة التي يمكن أن تظهر في تبويب المتصفح
    أو في مواضع أخرى تدعم أيقونة الموقع.
  -->

  <link rel="apple-touch-icon" href="icons/icon.svg">
  <!--
    يحدد أيقونة مقترحة عند إضافة الموقع إلى الشاشة الرئيسية
    على أجهزة Apple التي تدعم هذا النوع من الإعدادات.
    يفضل اختبار دعم SVG، وتوفير PNG إذا لزم الأمر.
  -->

  <title>مالي</title>
  <!--
    عنوان الصفحة الذي يظهر عادةً في تبويب المتصفح
    وفي بعض واجهات النظام.
  -->

  <link rel="stylesheet" href="css/style.css">
  <!--
    يحمّل ملف CSS المسؤول عن شكل الواجهة:
    الألوان، الأحجام، المسافات، ترتيب العناصر،
    تصميم الأزرار والنماذج، وإظهار وإخفاء أجزاء الصفحة.
  -->

  <script>
    /*
      التقاط حدث تثبيت التطبيق قبل تحميل وحدات JavaScript.
      هذه الخطوة مهمة لأن الحدث قد يحدث قبل أن يصل كود
      واجهة التثبيت إلى مرحلة الاستعداد لمعالجته.
    */

    // ننشئ خاصية عامة على window لحفظ حدث التثبيت مؤقتًا.
    // null تعني أنه لا يوجد حدث محفوظ حاليًا.
    window.__bip = null;

    // نستمع إلى الحدث beforeinstallprompt الذي تدعمه
    // بعض المتصفحات عندما يكون التطبيق مؤهلًا لعرض التثبيت.
    addEventListener('beforeinstallprompt', e => {

      // نمنع المتصفح من إظهار واجهة التثبيت التلقائية
      // في هذه الحالة، حتى يستطيع التطبيق التحكم بتوقيت عرضها.
      e.preventDefault();

      // نحفظ كائن الحدث نفسه لاستخدامه لاحقًا
      // عندما يضغط المستخدم على زر التثبيت.
      window.__bip = e;

      // نرسل حدثًا مخصصًا اسمه mali:bip.
      // يمكن لملفات JavaScript الأخرى الاستماع إليه
      // لمعرفة أن حدث التثبيت أصبح متاحًا.
      dispatchEvent(new Event('mali:bip'));
    });
  </script>
  <!--
    هذا السكربت موضوع في head حتى يبدأ الاستماع مبكرًا،
    قبل تحميل js/main.js وبقية الوحدات.
  -->

</head>

<body class="locked">
<!--
  يبدأ هنا المحتوى المرئي للصفحة.

  الصنف locked هو اسم CSS class، وليس خاصية مدمجة في HTML.
  غالبًا يُستخدم للتحكم في شكل الصفحة أو منع التمرير
  أو إخفاء الواجهة عندما تكون شاشة الدخول ظاهرة.
  نحتاج إلى مراجعة style.css وملفات تسجيل الدخول
  لمعرفة وظيفته الدقيقة في هذا المشروع.
-->

  <div class="instbox"></div>
  <!--
    مساحة مخصصة لواجهة التثبيت.
    توجد مرتين في الصفحة: هنا، ومرة أخرى داخل بطاقة الدخول.
    قد تستخدمها JavaScript لعرض زر تثبيت أو رسالة.
    وجود العنصر وحده لا ينفذ التثبيت؛ يجب أن يملأه الكود المناسب.
  -->

  <header>
    <h2 id="title"></h2>
  </header>
  <!--
    رأس الصفحة.

    h2 هو عنوان يتغير محتواه بحسب الصفحة الحالية غالبًا.
    id="title" يسمح لـ JavaScript بالعثور على هذا العنصر
    وتغيير النص بداخله باستخدام textContent أو وسيلة مناسبة.
  -->

  <main id="view"></main>
  <!--
    المساحة الرئيسية التي يفترض أن تعرض محتوى الصفحة الحالية.

    id="view" يسمح لكود JavaScript بإضافة محتوى مثل:
    لوحة التحكم، البيت، الاستثمار، التقارير أو الإعدادات.

    ترك العنصر فارغًا هنا يعني أن المحتوى قد يُنشأ
    ديناميكيًا بعد تحميل ملفات التطبيق.
  -->

  <button id="fab" data-action="fab" aria-label="إضافة عملية">
    ＋
  </button>
  <!--
    زر الإجراء العائم FAB (Floating Action Button).

    id="fab":
    يسمح لـ JavaScript وCSS باستهداف الزر.

    data-action="fab":
    سمة مخصصة لتحديد نوع الإجراء.
    قد يستخدمها مستمع أحداث عام ليتعرف على الزر
    دون الحاجة إلى كتابة مستمع منفصل لكل زر.

    aria-label:
    يوفّر اسمًا مفهومًا لقارئات الشاشة بدل الاعتماد على رمز + فقط.

    من المرجح أن يفتح الزر نموذج إضافة عملية مالية،
    لكن التأكيد يأتي من js/ui/actions.js والملفات المرتبطة به.
  -->

  <nav id="nav">
    <!--
      قائمة التنقل الرئيسية بين صفحات التطبيق.
      كل رابط يغيّر الجزء الموجود بعد # في عنوان الصفحة،
      وهو أسلوب شائع لبناء التنقل باستخدام Hash Router.
    -->

    <a href="#/dashboard" data-p="dashboard">
      <i>🏠</i>الرئيسية
    </a>
    <!--
      الرابط الأول يطلب الانتقال إلى لوحة التحكم.
      data-p="dashboard" يحدد اسم الصفحة بطريقة يسهل
      على JavaScript قراءتها لتحديث الصفحة النشطة.
    -->

    <a href="#/home" data-p="home">
      <i>🏡</i>البيت
    </a>
    <!--
      رابط قسم البيت، ويُفترض أن يعرض العمليات المنزلية
      أو البيانات المرتبطة بها.
    -->

    <a href="#/invest" data-p="invest">
      <i>📦</i>الاستثمار
    </a>
    <!--
      رابط قسم الاستثمار.
      المحتوى الحقيقي لهذا القسم تحدده ملفات JavaScript.
    -->

    <a href="#/reports" data-p="reports">
      <i>📊</i>التقارير
    </a>
    <!--
      رابط صفحة التقارير، التي قد تعرض ملخصات ومؤشرات مالية.
    -->

    <a href="#/settings" data-p="settings">
      <i>⚙️</i>الإعدادات
    </a>
    <!--
      رابط صفحة الإعدادات.
    -->

  </nav>

  <div id="sheet">
    <!--
      حاوية نافذة منبثقة أو لوحة سفلية Bottom Sheet.

      غالبًا تُستخدم لعرض نماذج إضافة الدخل والمصروف
      والبيع والشراء والتحويل وغيرها، دون مغادرة الصفحة.
    -->

    <div class="back" data-action="sheet-close"></div>
    <!--
      طبقة خلفية خلف اللوحة، وقد تُستخدم لتعتيم الصفحة.
      data-action="sheet-close" يحدد أن الضغط عليها
      يُفترض أن يغلق النافذة إذا كان مستمع الأحداث ينفذ ذلك.
    -->

    <div class="panel">
      <!--
        اللوحة التي تحتوي على العنوان والنموذج.
      -->

      <div class="bar">
        <h3></h3>
        <!--
          عنوان اللوحة، ومن المتوقع أن يتغير بحسب النموذج
          المفتوح، مثل إضافة دخل أو تسجيل مصروف.
        -->

        <button class="x" data-action="sheet-close">✕</button>
        <!--
          زر إغلاق اللوحة.

          data-action يتيح لآلية التعامل مع الأحداث
          التعرف على الإجراء المطلوب.
          لم يُحدد type، ولذلك يكون نوعه الافتراضي submit
          إذا وُضع داخل form؛ لكنه هنا خارج form مباشرةً.
          لذلك لا يُتوقع أن يرسل النموذج الموجود تحته.
        -->
      </div>

      <form id="form"></form>
      <!--
        نموذج عام تُضاف حقوله ديناميكيًا بواسطة JavaScript.

        id="form" يسمح لملفات الواجهة بإضافة حقول الإدخال،
        والتحقق من القيم، ثم معالجة إرسال العملية.

        قد تستخدمه ملفات مثل:
        js/ui/forms/income.js
        js/ui/forms/expense.js
        js/ui/forms/sale.js
        js/ui/forms/purchase.js
        وغيرها.
      -->
    </div>
  </div>

  <div id="login">
    <!--
      الحاوية الرئيسية لشاشة تسجيل الدخول.
      يمكن إظهارها أو إخفاؤها حسب حالة تسجيل الدخول.
    -->

    <div class="lhero">
      <!--
        الجزء العلوي من شاشة الدخول، ويحتوي على هوية التطبيق.
      -->

      <div class="logo">₪</div>
      <!--
        رمز الشيكل كعنصر بصري للهوية.
        هذا مجرد رمز معروض، وليس حسابًا ماليًا أو عملية حسابية.
      -->

      <h1>مالي</h1>
      <!--
        العنوان الرئيسي لشاشة الدخول.
      -->

      <p>أموال البيت والاستثمار بمكان واحد</p>
      <!--
        وصف مختصر لوظيفة التطبيق.
      -->
    </div>

    <div class="lcard">
      <!--
        بطاقة تسجيل الدخول التي تحتوي على الحقول والأزرار.
      -->

      <h2>أهلاً بك 👋</h2>
      <!--
        عنوان ترحيبي.
      -->

      <form id="lform">
        <!--
          نموذج تسجيل الدخول.

          عند إرساله، يمكن لـ JavaScript قراءة اسم المستخدم
          وكلمة السر والتحقق منهما.
          id="lform" يسمح بربط معالج إرسال النموذج به.
        -->

        <div class="fl">
          <!-- حاوية حقل اسم المستخدم. -->

          <label for="lu">اسم المستخدم</label>
          <!--
            يربط label بحقل الإدخال الذي يحمل id="lu".
            الضغط على التسمية يركز عادةً حقل الإدخال.
          -->

          <div class="fld">
            <!-- حاوية تنسيقية للأيقونة وحقل الإدخال. -->

            <span>👤</span>
            <!-- رمز بصري بجوار الحقل. -->

            <input
              id="lu"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
            >
            <!--
              حقل اسم المستخدم.

              id="lu": يسمح بالوصول إليه من JavaScript.
              autocomplete="username": يساعد المتصفح
              في اقتراح اسم المستخدم المحفوظ.
              autocapitalize="off": يطلب عدم تحويل الأحرف
              تلقائيًا إلى أحرف كبيرة في الأنظمة التي تدعم ذلك.
              spellcheck="false": يعطّل التدقيق الإملائي.

              لم يُحدد type، لذا يكون النوع الافتراضي text.
              ولم تُحدد required، لذا لا يفرض HTML وحده
              إدخال قيمة قبل إرسال النموذج.
            -->
          </div>
        </div>

        <div class="fl">
          <!-- حاوية حقل كلمة السر. -->

          <label for="lp">كلمة السر</label>
          <!-- تسمية مرتبطة بحقل كلمة السر. -->

          <div class="fld">
            <!-- حاوية الحقل والأيقونات. -->

            <span>🔒</span>
            <!-- رمز القفل بجوار حقل كلمة السر. -->

            <input
              id="lp"
              type="password"
              autocomplete="current-password"
            >
            <!--
              حقل كلمة السر.

              type="password" يخفي الأحرف أثناء الكتابة.
              autocomplete="current-password" يخبر المتصفح
              أن الحقل مخصص لكلمة السر الحالية للمستخدم.

              الإخفاء البصري لا يعني تشفير كلمة السر
              أو حماية طريقة تخزينها؛ ذلك يعتمد على منطق المصادقة.
            -->

            <button
              type="button"
              id="leye"
              aria-label="إظهار كلمة السر"
            >
              👁
            </button>
            <!--
              زر تبديل إظهار كلمة السر وإخفائها غالبًا.

              type="button" مهم هنا لأنه يمنع الزر من إرسال النموذج
              عند الضغط عليه.

              id="leye" يسمح لملف JavaScript بإضافة سلوك
              يبدّل نوع الحقل بين password وtext.
            -->
          </div>
        </div>

        <div id="lerr"></div>
        <!--
          مساحة لرسائل الخطأ، مثل بيانات دخول غير صحيحة.
          يجب أن يضيف JavaScript رسالة مناسبة عند الحاجة.
        -->

        <button class="btn">دخول</button>
        <!--
          زر إرسال نموذج تسجيل الدخول.
          لأن نوعه غير محدد، فهو submit افتراضيًا داخل form.
          class="btn" يحدد تصميمه في CSS.
        -->
      </form>

      <div class="lhint" id="lhint"></div>
      <!--
        مساحة إضافية لرسالة إرشادية أو معلومة عن تسجيل الدخول.
        محتواها يعتمد على JavaScript.
      -->

      <div class="instbox"></div>
      <!--
        مساحة ثانية لواجهة تثبيت التطبيق.
        قد تستخدمها الواجهة لعرض زر التثبيت داخل شاشة الدخول.
      -->

    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <!--
    نقطة الدخول الرئيسية لكود JavaScript.

    type="module" يسمح باستخدام:
    - import لاستيراد ملفات أخرى.
    - export لتصدير الدوال والمتغيرات.
    - نطاقات وحدات مستقلة بدل وضع كل المتغيرات في window.

    عند تحميل هذا الملف، يمكنه ربط الأحداث وتهيئة البيانات
    وتشغيل التنقل وعرض الصفحات والتحقق من تسجيل الدخول.

    وضع السكربت في نهاية body يعني أن عناصر HTML السابقة
    تكون قد قُرئت عادةً قبل بدء تنفيذ الوحدة.
  -->

</body>
</html>
