<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#166534">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>مالي</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/install.js"></script>
</head>
<body class="locked">
<div class="instbox"></div>
<header><h2 id="title">الرئيسية</h2></header>
<main id="view"></main>
<button id="fab" aria-label="إضافة عملية">＋</button>
<nav id="nav">
  <a href="#/dashboard" data-p="dashboard"><i>🏠</i>الرئيسية</a>
  <a href="#/home" data-p="home"><i>🏡</i>البيت</a>
  <a href="#/invest" data-p="invest"><i>📦</i>الاستثمار</a>
  <a href="#/reports" data-p="reports"><i>📊</i>التقارير</a>
  <a href="#/settings" data-p="settings"><i>⚙️</i>الإعدادات</a>
</nav>

<div id="sheet"><div class="back" data-close></div><div class="panel">
  <div class="bar"><h3>عملية جديدة</h3><button data-close class="x">✕</button></div>
  <form id="form"></form>
</div></div>

<div id="login">
  <div class="lhero">
    <div class="logo">₪</div>
    <h1>مالي</h1>
    <p>أموال البيت والاستثمار بمكان واحد</p>
  </div>
  <div class="lcard">
    <h2>أهلاً بك 👋</h2>
    <form id="lform">
      <div class="fl">
        <label for="lu">اسم المستخدم</label>
        <div class="fld"><span>👤</span><input id="lu" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
      </div>
      <div class="fl">
        <label for="lp">كلمة السر</label>
        <div class="fld"><span>🔒</span><input id="lp" type="password" autocomplete="current-password"><button type="button" id="leye" aria-label="إظهار كلمة السر">👁</button></div>
      </div>
      <div id="lerr"></div>
      <button class="btn">دخول</button>
    </form>
    <div class="lhint" id="lhint"></div>
    <div class="instbox"></div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/engine.js"></script>
<script src="js/router.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/home.js"></script>
<script src="js/pages/invest.js"></script>
<script src="js/pages/reports.js"></script>
<script src="js/pages/settings.js"></script>
<script>
DB.load();
let started=false;
function start(){
  document.body.classList.remove('locked');
  if(!started){started=true;R.start()}else R.render();
}
if(Auth.ok())start();else Auth.bind();
Auth.watch();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
