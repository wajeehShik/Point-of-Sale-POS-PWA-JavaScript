<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#166534">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>مالي</title>
<link rel="stylesheet" href="css/style.css">
<script>
/* التقاط حدث التثبيت مبكراً قبل تحميل الوحدات */
window.__bip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__bip=e;dispatchEvent(new Event('mali:bip'))});
</script>
</head>
<body class="locked">
<div class="instbox"></div>
<header><h2 id="title"></h2></header>
<main id="view"></main>
<button id="fab" data-action="fab" aria-label="إضافة عملية">＋</button>
<nav id="nav">
  <a href="#/dashboard" data-p="dashboard"><i>🏠</i>الرئيسية</a>
  <a href="#/home" data-p="home"><i>🏡</i>البيت</a>
  <a href="#/invest" data-p="invest"><i>📦</i>الاستثمار</a>
  <a href="#/reports" data-p="reports"><i>📊</i>التقارير</a>
  <a href="#/settings" data-p="settings"><i>⚙️</i>الإعدادات</a>
</nav>

<div id="sheet">
  <div class="back" data-action="sheet-close"></div>
  <div class="panel">
    <div class="bar"><h3></h3><button class="x" data-action="sheet-close">✕</button></div>
    <form id="form"></form>
  </div>
</div>

<div id="login">
  <div class="lhero">
    <div class="logo">₪</div>
    <h1>مالي</h1>
    <p>أموال البيت والاستثمار بمكان واحد</p>
  </div>
  <div class="lcard">
    <h2>أهلاً بك 👋</h2>
    <form id="lform">
      <div class="fl">
        <label for="lu">اسم المستخدم</label>
        <div class="fld"><span>👤</span><input id="lu" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
      </div>
      <div class="fl">
        <label for="lp">كلمة السر</label>
        <div class="fld"><span>🔒</span><input id="lp" type="password" autocomplete="current-password"><button type="button" id="leye" aria-label="إظهار كلمة السر">👁</button></div>
      </div>
      <div id="lerr"></div>
      <button class="btn">دخول</button>
    </form>
    <div class="lhint" id="lhint"></div>
    <div class="instbox"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
